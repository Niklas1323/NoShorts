name: Test-APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew assembleDebug --stacktrace

      # Play-Store-Version (AAB). Ohne Secrets unsigniert, nur als Kontrolle, dass die Release-Version baut.
      - name: Release-Schlüssel bereitstellen (falls vorhanden)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Play-Store-Version (AAB) bauen
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      # Nur signierte AAB hochladen, und nur als privates Artefakt (nicht im öffentlichen Release).
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true'
        with:
          name: FuckShorts-play-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Release-Schlüssel löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk FuckShorts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FuckShorts-apk
          path: FuckShorts.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fuck Shorts Test ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: FuckShorts.apk
          body: |
            Test-Version für das eigene Handy.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
