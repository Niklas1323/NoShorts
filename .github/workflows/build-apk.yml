name: Test-APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk FuckShorts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FuckShorts-apk
          path: FuckShorts.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fuck Shorts Test ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: FuckShorts.apk
          body: |
            Test-Version für das eigene Handy.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
